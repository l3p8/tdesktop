name: Build Telegram Android (New Standalone App)

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Reclaim runner disk space
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/boost

      # Step 2: Set up Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 3: Set up Android NDK (r27c)
      - name: Set up NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      # Step 4: Checkout source using v5
      - name: Checkout Telegram Android
        uses: actions/checkout@v5
        with:
          repository: 'DrKLO/Telegram'
          submodules: 'recursive'
          fetch-depth: 1

      # Step 5: Change Package ID & App Name to create an independent app
      - name: Customize App Identity
        run: |
          # 1. Change the Application ID / Package Name
          sed -i 's/APP_PACKAGE=org\.telegram\.messenger/APP_PACKAGE=org.telegram.messenger.custom/g' gradle.properties
          
          # 2. Change the App display name
          sed -i 's/<string name="AppName">Telegram<\/string>/<string name="AppName">Telegram NoAds<\/string>/g' TMessagesProj/src/main/res/values/strings.xml

      # Step 6: Delete old keystore and generate a fresh unique signing key
      - name: Generate Custom Signing Key
        run: |
          mkdir -p TMessagesProj/config
          # Delete the old template keystore so keytool creates a clean new one
          rm -f TMessagesProj/config/release.keystore

          keytool -genkeypair -v \
            -keystore TMessagesProj/config/release.keystore \
            -alias customkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass mysecretpass123 \
            -keypass mysecretpass123 \
            -dname "CN=TelegramCustom, OU=Client, O=AdFree, L=Munich, C=DE"

          # Update gradle.properties with the new keystore passwords
          sed -i 's/RELEASE_KEY_PASSWORD=.*/RELEASE_KEY_PASSWORD=mysecretpass123/g' gradle.properties
          sed -i 's/RELEASE_KEY_ALIAS=.*/RELEASE_KEY_ALIAS=customkey/g' gradle.properties
          sed -i 's/RELEASE_STORE_PASSWORD=.*/RELEASE_STORE_PASSWORD=mysecretpass123/g' gradle.properties

      # Step 7: Safely configure Telegram API credentials
      - name: Configure API Credentials
        env:
          APP_ID: ${{ secrets.TDESKTOP_API_ID || secrets.API_ID || secrets.APP_ID }}
          APP_HASH: ${{ secrets.TDESKTOP_API_HASH || secrets.API_HASH || secrets.APP_HASH }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$APP_HASH" ]; then
            echo "Applying custom API credentials..."
            sed -i "s/public static int APP_ID = .*/public static int APP_ID = $APP_ID;/" TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
            sed -i "s/public static String APP_HASH = .*/public static String APP_HASH = \"$APP_HASH\";/" TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          else
            echo "No custom API secrets found; keeping default build keys."
          fi

      # Step 8: Patch UserConfig.java to remove sponsored messages (ads)
      - name: Patch Ad-Free Status
        run: |
          sed -i 's/return user\.premium;/return true;/g' TMessagesProj/src/main/java/org/telegram/messenger/UserConfig.java

      # Step 9: Build Standalone Release APK
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_AppStandalone:assembleAfatRelease -x lint -x test --no-daemon --parallel --stacktrace

      # Step 10: Upload the standalone APK artifact using v5
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: Telegram-Android-Standalone-NoAds
          path: |
            TMessagesProj_AppStandalone/build/outputs/apk/**/*.apk
            TMessagesProj/build/outputs/apk/**/*.apk
