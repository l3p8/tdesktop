name: Build Telegram Desktop (No Ads)

on:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Free up disk space
      - name: Free Disk Space on Runner
        run: |
          echo "=== Disk space BEFORE cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/lib/jvm
          sudo docker system prune -af --volumes
          sudo apt-get clean
          echo "=== Disk space AFTER cleanup ==="
          df -h /

      # Step 2: Turn off existing swap & allocate a fresh 8GB Swap
      - name: Setup Swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      # Step 3: Checkout Telegram Desktop source code
      - name: Checkout Telegram Desktop
        uses: actions/checkout@v4
        with:
          repository: 'telegramdesktop/tdesktop'
          submodules: 'recursive'
          fetch-depth: 1

      # Step 4: Patch out sponsored messages (ads)
      - name: Patch Sponsored Messages
        run: |
          sed -i '/bool SponsoredMessages::canHaveFor/,/^[}]$/ {
              /bool SponsoredMessages::canHaveFor/! {
                  /^[}]$/!d
              }
              /bool SponsoredMessages::canHaveFor/a \    return false;
          }' Telegram/SourceFiles/data/components/sponsored_messages.cpp

      # Step 5: Pull image & compile binary
      - name: Build Binary
        env:
          TDESKTOP_API_ID: ${{ secrets.TDESKTOP_API_ID }}
          TDESKTOP_API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          docker run --rm \
            -u $(id -u) \
            -v "$PWD:/usr/src/tdesktop" \
            ghcr.io/telegramdesktop/tdesktop/centos_env:latest \
            /usr/src/tdesktop/Telegram/build/docker/centos_env/build.sh \
            -D TDESKTOP_API_ID="$TDESKTOP_API_ID" \
            -D TDESKTOP_API_HASH="$TDESKTOP_API_HASH"

      # Step 6: Strip symbols and package binary
      - name: Package Binary
        run: |
          strip out/Release/Telegram
          tar -czf telegram-desktop-linux.tar.gz -C out/Release Telegram

      # Step 7: Upload artifact for download
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-desktop-noads
          path: telegram-desktop-linux.tar.gz
